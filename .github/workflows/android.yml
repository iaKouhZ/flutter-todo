name: Android APK
on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'platform/**'
      - 'pubspec.yaml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: stable
          cache: true
      - name: Prepare Android project
        run: bash platform/prepare-android.sh
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: todo-endfield-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

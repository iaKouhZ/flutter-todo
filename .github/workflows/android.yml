name: Android APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android.yml'
      - 'lib/**'
      - 'test/**'
      - 'platform/**'
      - 'pubspec.yaml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: stable
          cache: true
      - name: Prepare Android project
        run: bash platform/prepare-android.sh
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build Android APK
        run: flutter build apk --release --build-number "$((GITHUB_RUN_NUMBER + 1))"
      - name: Test Android widget
        working-directory: android
        run: ./gradlew :app:testReleaseUnitTest
      - name: Sign and verify release APK
        id: signing
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_B64" && -z "$ANDROID_KEYSTORE_PASSWORD" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
              echo "::error::Configure the Android signing repository secrets before producing a signed APK."
              exit 1
            fi
            echo "::notice::Android signing secrets are not configured. Build checks ran without a signed APK artifact."
            exit 0
          fi
          : "${ANDROID_KEYSTORE_B64:?Missing Android signing keystore}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing Android signing password}"
          umask 077
          keyfile=$(mktemp "$RUNNER_TEMP/todo-keystore.XXXXXX")
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$keyfile"

          tools_dir=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          export APKSIGNER_JAR="$tools_dir/lib/apksigner.jar"
          bash platform/sign-android.sh build/app/outputs/flutter-apk/app-release.apk \
            dist/flutter-todo.apk "$keyfile"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Upload signed APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: dist/flutter-todo.apk
          archive: false
          if-no-files-found: error

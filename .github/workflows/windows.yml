name: Windows installers
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows.yml'
      - 'platform/windows/**'
      - 'platform/*windows*'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/windows.yml'
      - 'platform/windows/**'
      - 'platform/*windows*'
  workflow_dispatch:
    inputs:
      architecture:
        description: Windows architecture
        type: choice
        default: all
        options: [all, x64, arm64]

permissions:
  contents: read

jobs:
  build:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.architecture == 'x64' && '["x64"]' || github.event_name == 'workflow_dispatch' && inputs.architecture == 'arm64' && '["arm64"]' || '["x64","arm64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-2022' }}
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          architecture: x64
          cache: true
          cache-key: todo-flutter-windows-${{ matrix.arch }}-3.44.0-native-v1
      - name: Bootstrap native ARM64 Dart and engine
        if: matrix.arch == 'arm64'
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') { throw 'Expected native ARM64 PowerShell.' }
          Remove-Item -LiteralPath "$env:FLUTTER_ROOT/bin/cache/engine-dart-sdk.stamp" -Force -ErrorAction SilentlyContinue
          & "$env:FLUTTER_ROOT/bin/internal/update_dart_sdk.ps1"
          Remove-Item -LiteralPath "$env:FLUTTER_ROOT/bin/cache/flutter_tools.snapshot" -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath "$env:FLUTTER_ROOT/bin/cache/flutter_tools.stamp" -Force -ErrorAction SilentlyContinue
          $dartVersion = & "$env:FLUTTER_ROOT/bin/dart.bat" --version 2>&1 | Out-String
          Write-Output $dartVersion
          if ($dartVersion -notmatch 'windows_arm64') { throw 'Expected native ARM64 Dart.' }
          flutter precache --windows
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 engine setup failed.' }
      - name: Generate Windows project
        run: ./platform/prepare-windows.ps1
      - name: Audit registry writes
        run: |
          $sources = Get-ChildItem windows/runner -Include *.cpp,*.h -Recurse
          $writes = $sources | Select-String -Pattern '\bReg(Create|Set|Delete|Replace|Restore|Load|UnLoad|Save|Rename|SetKeySecurity)\w*\s*\('
          if ($writes) { throw 'Registry write call found in Windows runner sources.' }
          if (Select-String -Path platform/windows-installer.iss -Pattern '^\[Registry\]') {
            throw 'Installer includes registry entries.'
          }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build Windows application
        run: |
          flutter build windows --release --build-number "$env:GITHUB_RUN_NUMBER"
          if ($LASTEXITCODE -ne 0) { throw 'Flutter Windows build failed.' }
      - name: Package installer
        run: ./platform/package-windows.ps1 -TargetArch ${{ matrix.arch }}
      - name: Verify Windows application and installer
        run: ./platform/verify-windows.ps1 -TargetArch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          path: dist/flutter-todo-windows-${{ matrix.arch }}-setup.exe
          archive: false
          if-no-files-found: error
